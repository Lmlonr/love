<!DOCTYPE html>
<html>
<head>
  <title>For My Love ❤️</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      z-index: 2;
    }

    .box, .card {
      background: white;
      padding: 40px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    input {
      padding: 12px;
      width: 220px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
      text-align: center;
    }

    button {
      margin-top: 15px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: #ff4d6d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #ff1e4d;
    }

    .hidden {
      display: none;
    }

    .hug {
      font-size: 100px;
      animation: hugMove 1.5s infinite alternate;
    }

    @keyframes hugMove {
      from { transform: scale(1); }
      to { transform: scale(1.12); }
    }

    h1 {
      color: #ff4d6d;
      font-size: 45px;
    }

    p {
      font-size: 22px;
      color: #444;
    }

    .heart {
      position: absolute;
      color: red;
      font-size: 25px;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box" id="loginBox">
      <h2>Enter Secret Word ❤️</h2>
      <input type="password" id="password" placeholder="Type here...">
      <br>
      <button onclick="showLove()">Enter</button>
    </div>

    <div class="card hidden" id="loveCard">
      <div class="hug">🧑‍🤝‍🧑💞</div>
      <h1>I Love You ❤️</h1>
      <p>You are my favorite person in the world.</p>
    </div>
  </div>

  <script>
    function showLove() {
      const pass = document.getElementById("password").value;

      if(pass === "love") {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("loveCard").classList.remove("hidden");
      } else {
        alert("Wrong secret word ❤️ Hint: love");
      }
    }

    document.getElementById("password").addEventListener("keydown", function(event) {
      if(event.key === "Enter") {
        showLove();
      }
    });

    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = Math.random() * 3 + 3 + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 5000);
    }

    setInterval(createHeart, 300);
  </script>

</body>
</html>
